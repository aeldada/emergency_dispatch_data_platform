version: 2

models:
  - name: fire_ems_unit
    description: >
      One row per fire/EMS unit on a call (key rowid), calls received from
      2015-01-01 (San Francisco local date). Built from bronze.fire_ems_raw:
      rows with a call_number that is not exactly 9 digits are removed; the
      newest version of each rowid is kept; types are cast; every timestamp has
      its local value (as delivered) and a UTC column (suffix _utc); service
      class comes from the seed call_type_class; battalion, zip code and area
      are cleaned; timestamp-order flags are added. Full rebuild on every run.
      Not carried: address and case_location (fine-grained location).
    columns:

      # --- identifiers ---
      - name: rowid
        description: Source row ID; one row per unit on a call. Primary key.
        data_tests: [not_null, unique]
      - name: call_number
        description: Call ID, exactly 9 digits. Several units share one call_number.
        data_tests: [not_null]
      - name: incident_number
        description: Incident ID as delivered by the source.
      - name: unit_id
        description: ID of the responding unit (for example an engine or medic unit).
      - name: unit_type
        description: Kind of unit as delivered (for example ENGINE, MEDIC, PRIVATE).
      - name: unit_sequence_in_call_dispatch
        description: Order in which this unit was dispatched to the call; 1 = first unit. Missing on a few rows.

      # --- call description ---
      - name: call_type
        description: Type of call as delivered by the source (32 values over the full history).
      - name: service_class
        description: Fire, EMS, Traffic Collision, Other, or Unmapped, from the seed call_type_class. Unmapped = class not decided yet.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Fire', 'EMS', 'Traffic Collision', 'Other', 'Unmapped']
      - name: call_type_group
        description: Group as delivered (a severity or alarm level per call, missing for older years). Carried as delivered; not used yet.
      - name: call_final_disposition
        description: Final outcome of the call as delivered.
      - name: original_priority
        description: Priority when the call was created, as delivered (mixed codes; not used).
      - name: priority
        description: Priority as delivered (mixed codes; not used).
      - name: final_priority
        description: Final priority; the priority used by this project. Only 2 and 3 occur.
        data_tests:
          - accepted_values:
              arguments:
                values: ['2', '3']
      - name: als_unit
        description: true when the unit is an advanced life support unit, as delivered.
      - name: number_of_alarms
        description: Number of alarms for the call, as delivered.

      # --- dates ---
      - name: call_date
        description: Date of the call as delivered (local).
      - name: watch_date
        description: Watch (shift) date as delivered (local).

      # --- timestamps: local value as delivered + UTC instant ---
      - name: received_dttm
        description: Call received, San Francisco local time as delivered.
        data_tests: [not_null]
      - name: received_utc
        description: Call received, as a UTC instant.
      - name: entry_dttm
        description: Call entered in the dispatch system, local time.
      - name: entry_utc
        description: Call entered, UTC.
      - name: dispatch_dttm
        description: Unit dispatched, local time.
      - name: dispatch_utc
        description: Unit dispatched, UTC.
      - name: response_dttm
        description: Response time stamp as delivered by the source, local time.
      - name: response_utc
        description: Response time stamp, UTC.
      - name: on_scene_dttm
        description: Unit arrived on scene, local time. Missing on about a fifth of rows.
      - name: on_scene_utc
        description: Unit arrived on scene, UTC.
      - name: transport_dttm
        description: Transport started (ambulance units), local time.
      - name: transport_utc
        description: Transport started, UTC.
      - name: hospital_dttm
        description: Arrived at hospital (ambulance units), local time.
      - name: hospital_utc
        description: Arrived at hospital, UTC.
      - name: available_dttm
        description: Unit available again, local time.
      - name: available_utc
        description: Unit available again, UTC.

      # --- location (neighbourhood level and coarser) ---
      - name: battalion
        description: Battalion B01 to B10; any other code (for example B99) becomes Unknown.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['B01','B02','B03','B04','B05','B06','B07','B08','B09','B10','Unknown']
      - name: station_area
        description: Fire station area as delivered.
      - name: box
        description: Fire alarm box as delivered.
      - name: fire_prevention_district
        description: Fire prevention district as delivered.
      - name: supervisor_district
        description: Supervisor district as delivered.
      - name: area
        description: Neighbourhood; missing values and the text 'None' become Unknown. A location is never inferred.
        data_tests: [not_null]
      - name: zipcode_of_incident
        description: Zip code as text, with a trailing '.0' removed.
      - name: city
        description: City as delivered (several spellings); kept raw, not used.

      # --- flags ---
      - name: is_private_unit
        description: true when unit_type is PRIVATE (private ambulance company). These units stay in all metrics.
      - name: is_on_scene_before_received
        description: true = on scene earlier than received (broken order); false = in order; NULL = a time is missing. Equal times are not broken.
      - name: is_on_scene_before_dispatch
        description: true = on scene earlier than dispatch; false = in order; NULL = a time is missing.
      - name: is_dispatch_before_received
        description: true = dispatch earlier than received; false = in order; NULL = a time is missing. Does not invalidate any response-time metric.
      - name: is_available_before_dispatch
        description: true = available again earlier than dispatch; false = in order; NULL = a time is missing. Lifecycle check only.
      - name: is_call_to_arrival_order_valid
        description: true = received and on scene present and in order; false = on scene earlier than received; NULL = a time is missing (cannot check). Used by Gold for the call-to-arrival duration.
      - name: is_dispatch_to_arrival_order_valid
        description: true = dispatch and on scene present and in order; false = on scene earlier than dispatch; NULL = a time is missing (cannot check). Used by Gold for the dispatch-to-arrival duration.

      # --- source metadata and lineage ---
      - name: data_as_of
        description: Source timestamp as delivered by the publisher (not used for loading).
      - name: data_loaded_at
        description: When the publisher loaded this version of the row (San Francisco local time). Used to keep the newest version.
      - name: source_file
        description: Bronze S3 file the row came from (path relative to raw/).
      - name: file_row
        description: Position of the row in that file.
      - name: bronze_loaded_at
        description: When the row was loaded into the local Bronze table.
