version: 2

models:
  - name: fire_ems_unit
    description: >
      One row per fire/EMS unit on a call (key rowid), calls received from
      2015-01-01 (San Francisco local date). Built from bronze.fire_ems_raw:
      rows with a call_number that is not exactly 9 digits are removed; the
      newest version of each rowid is kept; types are cast; every timestamp has
      its local value (as delivered) and a UTC column (suffix _utc); service
      class comes from the seed call_type_class; battalion, zip code and area
      are cleaned; timestamp-order flags are added. Full rebuild on every run.
      Not carried: address and case_location (fine-grained location).
    columns:

      # --- identifiers ---
      - name: rowid
        description: Source row ID; one row per unit on a call. Primary key.
        data_tests: [not_null, unique]
      - name: call_number
        description: Call ID, exactly 9 digits. Several units share one call_number.
        data_tests: [not_null]
      - name: unit_type
        description: Kind of unit as delivered (for example ENGINE, MEDIC, PRIVATE).
      - name: unit_sequence_in_call_dispatch
        description: Order in which this unit was dispatched to the call; 1 = first unit. Missing on a few rows.

      # --- call description ---
      - name: call_type
        description: Type of call as delivered by the source (32 values over the full history).
      - name: service_class
        description: Fire, EMS, Traffic Collision, Other, or Unmapped, from the seed call_type_class. Unmapped = class not decided yet.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Fire', 'EMS', 'Traffic Collision', 'Other', 'Unmapped']
      - name: call_type_group
        description: Group as delivered (a severity or alarm level per call, missing for older years). Carried as delivered; not used yet.
      - name: original_priority
        description: Priority when the call was created, as delivered (mixed codes; not used).
      - name: priority
        description: Priority as delivered (mixed codes; not used).
      - name: final_priority
        description: Final priority; the priority used by this project. Only 2 and 3 occur.
        data_tests:
          - accepted_values:
              arguments:
                values: ['2', '3']
      - name: als_unit
        description: true when the unit is an advanced life support unit, as delivered.


      # --- timestamps: local value as delivered + UTC instant ---
      - name: received_dttm
        description: Call received, San Francisco local time as delivered.
        data_tests: [not_null]
      - name: response_dttm
        description: Response time stamp as delivered by the source, local time.
      - name: on_scene_dttm
        description: Unit arrived on scene, local time. Missing on about a fifth of rows.

      # --- location (neighbourhood level and coarser) ---
      - name: battalion
        description: Battalion B01 to B10; any other code (for example B99) becomes Unknown.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['B01','B02','B03','B04','B05','B06','B07','B08','B09','B10','Unknown']
      - name: area
        description: Neighbourhood; missing values and the text 'None' become Unknown. A location is never inferred.
        data_tests: [not_null]
      - name: zipcode_of_incident
        description: Zip code as text, with a trailing '.0' removed.
      - name: city
        description: City as delivered (several spellings); kept raw, not used.

      # --- flags ---
      - name: is_private_unit
        description: true when unit_type is PRIVATE (private ambulance company). These units stay in all metrics.
      - name: is_on_scene_before_received
        description: true = on scene earlier than received (broken order); false = in order; NULL = a time is missing. Equal times are not broken.
      - name: is_on_scene_before_dispatch
        description: true = on scene earlier than dispatch; false = in order; NULL = a time is missing.
      - name: is_dispatch_before_received
        description: true = dispatch earlier than received; false = in order; NULL = a time is missing. Does not invalidate any response-time metric.
      - name: is_available_before_dispatch
        description: true = available again earlier than dispatch; false = in order; NULL = a time is missing. Lifecycle check only.
      - name: is_call_to_arrival_order_valid
        description: true = received and on scene present and in order; false = on scene earlier than received; NULL = a time is missing (cannot check). Used by Gold for the call-to-arrival duration.
      - name: is_dispatch_to_arrival_order_valid
        description: true = dispatch and on scene present and in order; false = on scene earlier than dispatch; NULL = a time is missing (cannot check). Used by Gold for the dispatch-to-arrival duration.

      # --- source metadata and lineage ---
      - name: data_loaded_at
        description: When the publisher loaded this version of the row (San Francisco local time). Used to keep the newest version.
      - name: source_file
        description: Bronze S3 file the row came from (path relative to raw/).
      - name: file_row
        description: Position of the row in that file.

  - name: police_call
    description: >
      One row per police call (key cad_number), calls received from 2015-01-01
      (San Francisco local date). Built from bronze.police_raw: rows with a
      cad_number that is not exactly 9 digits are removed; the newest version of
      each cad_number is kept; types are cast; every timestamp has its local value
      (as delivered) and a UTC column (suffix _utc); priority and area are cleaned;
      timestamp-order flags are added. All onview_flag kinds are kept. Full rebuild
      on every run. Not carried: call_type_original_notes, call_type_final_notes,
      pd_incident_report, intersection_name, intersection_id, intersection_point.
    columns:

      # --- identifiers ---
      - name: cad_number
        description: Call ID, exactly 9 digits. Primary key.
        data_tests: [not_null, unique]
      - name: dup_cad_number
        description: ID of the call this one is linked to as a duplicate, as delivered. Empty for most calls. Linked duplicates are still counted.
      - name: agency
        description: Responding agency as delivered (Police, Municipal Transportation Agency, HEART, Sheriff). HEART exists only from 2023.
        data_tests:
          - accepted_values:
              arguments:
                values: ['Police', 'Municipal Transportation Agency', 'HEART', 'Sheriff']
      - name: onview_flag
        description: N = public 911 call; Y = officer-initiated (nobody called); HSOC = 311 referral to street outreach. Demand counts N and HSOC; response time uses N only.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['N', 'Y', 'HSOC']

      # --- call description ---
      - name: priority_original
        description: Priority when the call was created, as delivered (not used).
      - name: priority_final
        description: Final priority A, B, C or I; any other code becomes Other. NULL when missing in the source (handling not decided yet; a test reports it).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['A', 'B', 'C', 'I', 'Other']
      - name: disposition
        description: Outcome of the call as delivered. Informational only; not used in metrics.
      - name: sensitive_call
        description: true when the publisher suppressed the location of the call, as delivered.

      # --- timestamps: local value as delivered + UTC instant ---
      - name: received_datetime
        description: Call received, San Francisco local time as delivered.
        data_tests: [not_null]
      - name: onscene_datetime
        description: First unit on scene, local time. Missing on a growing share of calls.
      - name: close_datetime
        description: Call closed (last unit), local time. Not used in order checks.

      # --- location (neighbourhood level and coarser) ---
      - name: area
        description: Neighbourhood (analysis_neighborhood); missing values and the text 'None' become Unknown. A location is never inferred.
        data_tests: [not_null]

      # --- flags ---
      - name: is_on_scene_before_received
        description: true = on scene earlier than received (broken order); false = in order; NULL = a time is missing. Equal times are not broken.
      - name: is_on_scene_before_dispatch
        description: true = on scene earlier than dispatch; false = in order; NULL = a time is missing.
      - name: is_dispatch_before_received
        description: true = dispatch earlier than received; false = in order; NULL = a time is missing. Does not invalidate any response-time metric.
      - name: is_call_to_arrival_order_valid
        description: true = received and on scene present and in order; false = on scene earlier than received; NULL = a time is missing (cannot check). Used by Gold for the call-to-arrival duration.
      - name: is_dispatch_to_arrival_order_valid
        description: true = dispatch and on scene present and in order; false = on scene earlier than dispatch; NULL = a time is missing (cannot check). Used by Gold for the dispatch-to-arrival duration.

      # --- source metadata and lineage ---
      - name: data_loaded_at
        description: When the publisher loaded this version of the row (San Francisco local time). Used to keep the newest version.
      - name: data_updated_at
        description: Publisher timestamp as delivered; meaning not documented; not used. Kept in Silver only, for tracing.
      - name: source_filename
        description: Publisher's extract file the row came from, as delivered. Kept in Silver only, for tracing data problems.
      - name: source_file
        description: Bronze S3 file the row came from (path relative to raw/).
      - name: file_row
        description: Position of the row in that file.

  - name: fire_ems_call
    description: >
      One row per fire/EMS call (key call_number), calls received from
      2015-01-01. Built from silver.fire_ems_unit by taking the call's first
      unit: the unit with dispatch sequence 1; if the call has none, the unit
      with the earliest dispatch time; if still tied, the lowest rowid.
      Call-level fields (call type, priority, location, call times) are the same
      on every unit of a call (tested). Dispatch and on-scene times are the
      first unit's and define the call's response times. Unit-only fields stay
      in fire_ems_unit; first_unit_rowid links back. Timestamps as in
      fire_ems_unit (local value + _utc). No durations; they are computed in
      Gold. Full rebuild on every run.
    columns:

      # --- identifiers ---
      - name: call_number
        description: Call ID, exactly 9 digits. Primary key.
        data_tests: [not_null, unique]
      - name: first_unit_rowid
        description: rowid of the unit chosen as the call's first unit; links to fire_ems_unit.
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('fire_ems_unit')
                field: rowid

      # --- call times ---
      - name: received_dttm
        description: Call received, San Francisco local time as delivered.
        data_tests: [not_null]
      - name: dispatch_dttm
        description: First unit dispatched, local time.
      - name: on_scene_dttm
        description: First unit arrived on scene, local time. Missing on a share of calls.

      # --- classification ---
      - name: service_class
        description: Fire, EMS, Traffic Collision, Other, or Unmapped (from the seed call_type_class).
        data_tests: [not_null]
      - name: call_type_group
        description: Group as delivered; cannot be derived from call_type (open point). Carried, not used.
      - name: final_priority
        description: Final priority; the priority used by this project. Only 2 and 3 occur.

      # --- location ---
      - name: battalion
        description: Battalion B01 to B10, otherwise Unknown.
        data_tests: [not_null]
      - name: area
        description: Neighbourhood; missing values become Unknown. A location is never inferred.
        data_tests: [not_null]

      # --- from the first unit ---
      - name: is_private_unit
        description: true when the first unit is a private ambulance company.
      - name: is_call_to_arrival_order_valid
        description: First unit's flag. true = received and on scene present and in order; false = on scene earlier than received; NULL = a time is missing. Gold computes call-to-arrival time only when true.
      - name: is_dispatch_to_arrival_order_valid
        description: First unit's flag. true = dispatch and on scene present and in order; false = on scene earlier than dispatch; NULL = a time is missing. Gold computes dispatch-to-arrival time only when true.
