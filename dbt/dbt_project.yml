name: emergency_dispatch
version: "1.0.0"
config-version: 2
profile: emergency_dispatch

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]

models:
  emergency_dispatch:
    silver:
      +schema: silver
      +materialized: table      # full rebuild on every run
    gold:
      +schema: gold
    marts:
      +schema: marts
    quarantine:
      +schema: quarantine

seeds:
  emergency_dispatch:
    +schema: silver

vars:
  id_length: 9                          # call IDs are documented as 9-digit numbers
  silver_start_date: '2015-01-01'       # Silver holds calls received from this local date on
  source_timezone: 'America/Los_Angeles'  # source timestamps are San Francisco local time
  valid_battalions: ['B01','B02','B03','B04','B05','B06','B07','B08','B09','B10']
  fire_priorities: ['2','3']
  police_priorities: ['A','B','C','I']
